# ─────────────────────────────────────────────────────────────────────────────
# Build Windows x64 MSI installer (customizado)
# ─────────────────────────────────────────────────────────────────────────────
# COMO USAR:
#   1. Crie um repositório no GitHub (público ou privado)
#   2. git init && git remote add origin <url> && git push -u origin main
#   3. Vá em Actions > "Build Windows MSI" > Run workflow
#   4. Quando terminar, baixe o artefato "rustdesk-windows-msi" (arquivo .msi)
# ─────────────────────────────────────────────────────────────────────────────

name: Build Windows MSI

on:
  workflow_dispatch:   # disparo manual pela aba Actions do GitHub
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'flutter/**'
      - 'libs/**'
      - 'res/msi/**'
      - '.github/workflows/build-windows-msi.yml'

env:
  FLUTTER_VERSION:    "3.24.5"
  LLVM_VERSION:       "15.0.6"
  RUST_VERSION:       "1.75"
  VCPKG_COMMIT_ID:    "120deac3062162151622ca4860575a33844ba10b"
  CARGO_EXPAND_VERSION:       "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"

jobs:
  # ── 1. Gera os arquivos bridge Rust↔Flutter ──────────────────────────────
  generate-bridge:
    name: Generate flutter-rust-bridge
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake curl gcc git g++ libclang-dev libgtk-3-dev \
            llvm-dev nasm ninja-build pkg-config wget

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: bridge-ubuntu

      - name: Cache bridge output
        id: cache-bridge
        uses: actions/cache@v3
        with:
          path: /tmp/flutter_rust_bridge
          key: bridge-${{ env.FLUTTER_VERSION }}-${{ hashFiles('src/flutter_ffi.rs') }}

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install flutter_rust_bridge tooling
        run: |
          cargo install cargo-expand  --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd

      - name: Run flutter_rust_bridge_codegen
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  # ── 2. Compila o MSI no Windows ──────────────────────────────────────────
  build-windows-msi:
    name: Windows x64 MSI
    needs: generate-bridge
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        uses: KyleMayes/install-llvm-action@v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Patch flutter (dropdown filter)
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff \
             "$(dirname $(dirname $(which flutter)))"
          cd "$(dirname $(dirname $(which flutter)))"
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff || true

      - name: Replace engine (x64 custom engine)
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest `
            -Uri "https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip" `
            -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          $engineDir = "C:\hostedtoolcache\windows\flutter\stable-${{ env.FLUTTER_VERSION }}-x64\bin\cache\artifacts\engine\windows-x64-release"
          if (Test-Path $engineDir) {
            mv -Force windows-x64-release\* $engineDir\
          }

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-2022

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          $VCPKG_ROOT/vcpkg install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed" || {
              find "$VCPKG_ROOT/" -name "*.log" -exec sh -c 'echo "{}:"; cat "{}"' \;
              exit 1
            }

      - name: Build RustDesk (Flutter Windows)
        shell: pwsh
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          mv .\flutter\build\windows\x64\runner\Release .\rustdesk

      - name: Download usbmmidd_v2
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip" `
            -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse -ErrorAction SilentlyContinue
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe","usbmmidd_v2\deviceinstaller.exe","usbmmidd_v2\usbmmidd.bat" -ErrorAction SilentlyContinue
          mv -Force .\usbmmidd_v2 .\rustdesk

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build MSI (WiX v4)
        shell: pwsh
        run: |
          pushd .\res\msi
          python preprocess.py --arp -d ..\..\rustdesk
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem .\Package\bin\*\Release\en-us\Package.msi | Select-Object -First 1
          Copy-Item $msi.FullName ..\..\rustdesk-custom-x64.msi
          popd

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-msi
          path: rustdesk-custom-x64.msi
          retention-days: 30
